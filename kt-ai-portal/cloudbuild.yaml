steps:
  - name: 'gcr.io/cloud-builders/docker'
    dir: '.'
    args:
      - 'build'
      - '--platform'
      - 'linux/amd64'
      - '--build-arg'
      - 'APP_BASE_URL=${_APP_BASE_URL}'
      - '--build-arg'
      - 'BACKEND_BASE_URL=${_BACKEND_BASE_URL}'
      - '--build-arg'
      - 'PREVIEW_ACCESS_CODE=${_PREVIEW_ACCESS_CODE}'
      - '--build-arg'
      - 'FIREBASE_API_KEY=${_FIREBASE_API_KEY}'
      - '--build-arg'
      - 'FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}'
      - '--build-arg'
      - 'FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}'
      - '--build-arg'
      - 'FIREBASE_APP_ID=${_FIREBASE_APP_ID}'
      - '--build-arg'
      - 'DEMO_ALLOWED_EMAILS=${_DEMO_ALLOWED_EMAILS}'
      - '--build-arg'
      - 'DEMO_ALLOWED_DOMAINS=${_DEMO_ALLOWED_DOMAINS}'
      - '--build-arg'
      - 'DEMO_ADMIN_EMAILS=${_DEMO_ADMIN_EMAILS}'
      - '-f'
      - 'Dockerfile.demo'
      - '-t'
      - 'asia-northeast3-docker.pkg.dev/kai-platform-d0ae0/kt-ai-portal/kt-ai-portal-demo:latest'
      - 'backstage-portal'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-northeast3-docker.pkg.dev/kai-platform-d0ae0/kt-ai-portal/kt-ai-portal-demo:latest'
options:
  logging: CLOUD_LOGGING_ONLY
images:
  - 'asia-northeast3-docker.pkg.dev/kai-platform-d0ae0/kt-ai-portal/kt-ai-portal-demo:latest'
