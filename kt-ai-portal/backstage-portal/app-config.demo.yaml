app:
  title: 국방지능형플랫폼포털
  baseUrl: ${APP_BASE_URL}
  previewAccessCode: ${PREVIEW_ACCESS_CODE}
  previewAuthEnabled: true
  packages: all

  firebase:
    apiKey: ${FIREBASE_API_KEY}
    authDomain: ${FIREBASE_AUTH_DOMAIN}
    projectId: ${FIREBASE_PROJECT_ID}
    appId: ${FIREBASE_APP_ID}

  auth:
    allowedEmails: ${DEMO_ALLOWED_EMAILS}
    adminEmails: ${DEMO_ADMIN_EMAILS}

  # 제안/데모 환경 전용 캡처 모드. 운영 배포에서는 false 유지.
  proposalCapture:
    enabled: true
    allowedRoles: general-user,project-manager,branch-admin,portal-admin,security-manager,security-auditor

  extensions:
    - page:catalog:
        config:
          path: /

organization:
  name: 국방지능형플랫폼포털

backend:
  baseUrl: ${BACKEND_BASE_URL}
  listen:
    port: 7007
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  cors:
    origin: ${APP_BASE_URL}
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: better-sqlite3
    connection: ':memory:'

auth:
  environment: development
  session:
    secret: ${AUTH_SESSION_SECRET}
  providers:
    guest:
      dangerouslyAllowOutsideDevelopment: true

permission:
  enabled: true

mcpActions:
  name: '국방지능형플랫폼포털'

# Cloud Run에 Cloud SQL 인스턴스를 연결하고 비밀번호는 Secret Manager에서 주입한다.
portal:
  migrations:
    runOnStartup: false
  database:
    host: ${PORTAL_DB_HOST}
    port: '5432'
    database: portal_business
    user: ${PORTAL_DB_USER}
    password: ${PORTAL_DB_PASSWORD}
    poolMax: 5
